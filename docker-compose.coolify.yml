##############################################
# LiteLLM Docker Compose - Optimized for Coolify
# 
# CONFIGURACION DE DOMINIO:
# Solo necesitas 1 dominio para el servicio 'litellm'
# En Coolify, asigna tu dominio (ej: litellm.tudominio.com) al servicio 'litellm'
# 
# Los servicios 'db' y 'prometheus' NO necesitan dominio público
# (son internos o de monitoreo)
##############################################

services:
  litellm:
    # Servicio principal - ASIGNAR DOMINIO EN COOLIFY
    # Expone: API (puerto 4000) + UI Dashboard
    # 
    # Usar imagen pre-construida para despliegue rápido
    # Para producción con código custom, descomenta las líneas de build
    # build:
    #   context: .
    #   args:
    #     target: runtime
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://llmproxy:dbpassword9090@db:5432/litellm"
      STORE_MODEL_IN_DB: "True"
      # Variables de entorno desde Coolify
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional providers
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # Configuracion de estabilidad
      LITELLM_LOG: INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks:
      - litellm-network
    labels:
      # Labels para Coolify
      - "coolify.managed=true"
      - "coolify.name=litellm"
      - "coolify.type=application"
      - "coolify.http.enabled=true"
      - "coolify.http.port=4000"

  db:
    # Base de datos PostgreSQL - NO necesita dominio público
    # Comunicación interna únicamente (no exponer)
    image: postgres:16
    restart: unless-stopped
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpassword9090}
    # Puerto 5432 expuesto para desarrollo local
    # En Coolify producción, cambia a 'expose' si no necesitas acceso externo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - litellm-network
    labels:
      - "coolify.managed=false"

volumes:
  postgres_data:
    name: litellm_postgres_data

networks:
  litellm-network:
    driver: bridge
